[build]
  command = "npm install --production=false --legacy-peer-deps && npm run build"
  publish = ".next"

# Include all environment variables
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  # Ensure dev dependencies are installed for build
  NPM_FLAGS = "--legacy-peer-deps --production=false"

# Needed for NextAuth.js and API routes to work properly
[functions]
  included_files = ["node_modules/mongodb/**", "node_modules/@auth/**", "node_modules/bcryptjs/**", "node_modules/next-auth/**", "node_modules/tailwindcss/**"]
  node_bundler = "esbuild"

# NextAuth specific redirects - these must come BEFORE the general API redirects
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/next-api/auth/:splat"
  status = 200
  force = true

# API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/next-api/:splat"
  status = 200
  force = true

# Ensure JSON content type is preserved
[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json"
    X-Content-Type-Options = "nosniff"

# For SPA navigation - this must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  
# This helps catch issues with environment variable propagation
[template.environment]
  MONGODB_URI = "MongoDB connection string"
  NEXTAUTH_SECRET = "NextAuth secret key"
  NEXTAUTH_URL = "Your deployment URL (https://yourdomain.com)"
