[build]
  command = "npm install --production=false --legacy-peer-deps && npm run build"
  publish = ".next"

# Enable Next.js Runtime
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Function configuration
[functions]
  included_files = ["node_modules/mongodb/**", "node_modules/@auth/**", "node_modules/bcryptjs/**", "node_modules/next-auth/**", "node_modules/tailwindcss/**"]
  node_bundler = "esbuild"

# Critical: Use Netlify plugin for Next.js handling
[[plugins]]
  package = "@netlify/plugin-nextjs"

# No custom redirects needed - plugin handles this automatically

# Log environment variables
[build.processing]
  skip_processing = false

# Environment Variables
[template.environment]
  MONGODB_URI = "MongoDB connection string"
  NEXTAUTH_SECRET = "NextAuth secret key"
  NEXTAUTH_URL = "Your deployment URL (https://yourdomain.com)"
