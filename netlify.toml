[build]
  command = "npm install --production=false --legacy-peer-deps && npm run build"
  publish = ".next"

# Essential env settings
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"

# Simply reference the Next.js plugin without any inputs
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Make sure environment variables are available during build
[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/mongodb/**", "node_modules/@auth/**", "node_modules/bcryptjs/**", "node_modules/next-auth/**", "node_modules/tailwindcss/**"]
